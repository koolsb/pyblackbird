name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      needed: ${{ steps.tag.outputs.needed }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Read version from pyproject.toml
      id: version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "pyproject.toml declares $version"
    - name: Check whether that version is already released
      id: tag
      run: |
        if git rev-parse "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "needed=false" >> "$GITHUB_OUTPUT"
          echo "Tag ${{ steps.version.outputs.version }} already exists - nothing to release."
        else
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "Tag ${{ steps.version.outputs.version }} does not exist - releasing."
        fi

  test:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest
    - run: pytest

  release:
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build
    - name: Verify the built version matches
      run: |
        ls dist/
        test -f "dist/pyblackbird-${{ needs.check.outputs.version }}.tar.gz"
        test -f "dist/pyblackbird-${{ needs.check.outputs.version }}-py3-none-any.whl"
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26  # v1.14.2
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ needs.check.outputs.version }}" \
          --title "${{ needs.check.outputs.version }}" \
          --generate-notes \
          dist/*
