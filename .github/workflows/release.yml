name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

# Releases must not overlap. Two merges landing close together would
# otherwise both check for the tag before either has created it, and both
# would decide to release the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      needed: ${{ steps.tag.outputs.needed }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Read version from pyproject.toml
      id: version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "pyproject.toml declares $version"
    - name: Check whether that version is already released
      id: tag
      run: |
        if git rev-parse "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "needed=false" >> "$GITHUB_OUTPUT"
          echo "Tag ${{ steps.version.outputs.version }} already exists - nothing to release."
        else
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "Tag ${{ steps.version.outputs.version }} does not exist - releasing."
        fi

  test:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest
    - run: pytest

  release:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and release
      id-token: write   # mint the short-lived PyPI token via OIDC
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build
    - name: Verify the built version matches
      run: |
        ls dist/
        test -f "dist/pyblackbird-${{ needs.check.outputs.version }}.tar.gz"
        test -f "dist/pyblackbird-${{ needs.check.outputs.version }}-py3-none-any.whl"
    # Authenticates via PyPI trusted publishing: GitHub's OIDC identity is
    # exchanged for a short-lived token, so there is no API token to store.
    # PyPI must have a publisher registered for koolsb/pyblackbird against
    # this workflow filename.
    - name: Publish to PyPI
      # Docker action: the ref must be a commit SHA that has a matching
      # ghcr.io image, not an annotated tag's object SHA.
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        # The GitHub release is created after this step. If that ever fails,
        # the retry must not die on files PyPI already has.
        skip-existing: true
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ needs.check.outputs.version }}" \
          --title "${{ needs.check.outputs.version }}" \
          --generate-notes \
          dist/*
